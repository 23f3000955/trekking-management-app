<!DOCTYPE html>
<html>
<head>
    <title>Trekking Management App</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body style="background: linear-gradient(to right, #dbeafe, #dcfce7); min-height:100vh;">

<div id="app" class="container text-center pt-5">

    <h1 class="display-4 fw-bold text-primary mb-3">
        Trekking Management App
    </h1>

    <p class="lead mb-5">
        Plan, Manage and Book Treks Easily
    </p>

    <!-- Home Page -->
    <div v-if="currentPage !== 'user-dashboard' && currentPage !== 'admin-dashboard' && currentPage !== 'staff-dashboard'" class="card shadow-lg p-5 mx-auto border-0" style="max-width: 500px; border-radius:20px;">
        <h3 class="mb-4 text-success">Choose Role</h3>

        <button class="btn btn-primary w-100 mb-3" @click="goTo('user-login')">
            User Login
        </button>

        <button class="btn btn-success w-100 mb-3" @click="goTo('staff-login')">
            Staff Login
        </button>

        <button class="btn btn-dark w-100 mb-3" @click="goTo('admin-login')">
            Admin Login
        </button>

        <button class="btn btn-outline-primary w-100" @click="goTo('register')">
            Register as Trekker
        </button>
    </div>

    <!-- Register -->
    <div v-if="currentPage === 'register'" class="card shadow-lg p-5 mx-auto mt-4 border-0" style="max-width: 500px; border-radius:20px;">
        <h3 class="mb-4 text-primary">Register Trekker</h3>

        <input v-model="name" class="form-control mb-3" placeholder="Name">
        <input v-model="email" class="form-control mb-3" placeholder="Email">
        <input v-model="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-success w-100 mb-3" @click="registerUser">
            Register
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Back
        </button>

        <p class="mt-3 text-success">{{ message }}</p>
    </div>

    <!-- User Login -->
    <div v-if="currentPage === 'user-login'" class="card shadow-lg p-5 mx-auto mt-4 border-0" style="max-width: 500px; border-radius:20px;">
        <h3 class="mb-4 text-primary">User Login</h3>

        <input v-model="email" class="form-control mb-3" placeholder="Email">
        <input v-model="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-primary w-100 mb-3" @click="loginUser">
            Login
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Back
        </button>

        <p class="mt-3 text-success">{{ message }}</p>
    </div>

    <!-- Admin Login -->
    <div v-if="currentPage === 'admin-login'" class="card shadow-lg p-5 mx-auto mt-4 border-0" style="max-width: 500px; border-radius:20px;">
        <h3 class="mb-4 text-dark">Admin Login</h3>

        <input v-model="email" class="form-control mb-3" placeholder="Admin Email">
        <input v-model="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-dark w-100 mb-3" @click="loginUser">
            Login
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Back
        </button>

        <p class="mt-3 text-success">{{ message }}</p>
    </div>

    <!-- Staff Login -->
    <div v-if="currentPage === 'staff-login'" class="card shadow-lg p-5 mx-auto mt-4 border-0" style="max-width: 500px; border-radius:20px;">
        <h3 class="mb-4 text-success">Staff Login</h3>

        <input v-model="email" class="form-control mb-3" placeholder="Staff Email">
        <input v-model="password" type="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-success w-100 mb-3" @click="loginUser">
            Login
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Back
        </button>

        <p class="mt-3 text-success">{{ message }}</p>
    </div>

    <!-- User Dashboard -->
    <div v-if="currentPage === 'user-dashboard'" class="card shadow-lg p-4 mx-auto mt-4 border-0" style="max-width: 700px; border-radius:20px;">
        <h3 class="text-primary mb-4">User Dashboard</h3>

        <button class="btn btn-primary w-100 mb-3">
            View Available Treks
        </button>

        <button class="btn btn-success w-100 mb-3">
            My Bookings
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Logout
        </button>
    </div>

    <!-- Admin Dashboard -->
    <div v-if="currentPage === 'admin-dashboard'" class="card shadow-lg p-4 mx-auto mt-4 border-0" style="max-width: 700px; border-radius:20px;">
        <h3 class="text-dark mb-4">Admin Dashboard</h3>

        <button class="btn btn-dark w-100 mb-3">
            Add Trek
        </button>

        <button class="btn btn-primary w-100 mb-3">
            Manage Staff
        </button>

        <button class="btn btn-success w-100 mb-3">
            View Bookings
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Logout
        </button>
    </div>

    <!-- Staff Dashboard -->
    <div v-if="currentPage === 'staff-dashboard'" class="card shadow-lg p-4 mx-auto mt-4 border-0" style="max-width: 700px; border-radius:20px;">
        <h3 class="text-success mb-4">Staff Dashboard</h3>

        <button class="btn btn-success w-100 mb-3">
            Assigned Treks
        </button>

        <button class="btn btn-primary w-100 mb-3">
            Update Trek Status
        </button>

        <button class="btn btn-secondary w-100" @click="goTo('home')">
            Logout
        </button>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
